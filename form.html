<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icons8-html-16.png">
    <title>Job Application Form</title>
</head>

<body>
    <h1>Job Application Form</h1>
    <form action="" method="post">
        <label for="fname">Full Name:</label>
        <input type="text" id="fname" name="fname" placeholder="Enter your Name" required><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" required><br>
        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass" placeholder="Enter your Password"><br>
        <label for="phone">Phone Number:</label>
        <select name="phone" id="phone">
            <option value="+91">+91</option>
            <option value="+11">+11</option>
            <option value="+41">+41</option>
        </select>
        <input type="number" name="phone" placeholder="enter your number" required><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" placeholder="Enter your DOB"><br>
        <label> Select Your Gender</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <label for="age">Select your Age</label>
        <input type="number" id="age" name="age" min="20" max="30" required><br>
        <label for="address">Address:</label>
        <textarea id="address" name="address" placeholder="Enter your address.." cols="30" rows="3"
            required></textarea><br>
        <label for="course">Select your Department:</label>
        <select id="course" name="course" required>
            <option value="cse">Computer Science Engineering</option>
            <option value="eee">Electrical and Electronics Engineering</option>
            <option value="mech">Mechanical Engineering</option>
        </select><br>
        <label for="skill">Select Your Skills:</label>
        <input type="checkbox" id="skill1" name="skills" value="programming">
        <label for="skill1">Programming</label>
        <input type="checkbox" id="skill2" name="skills" value="design">
        <label for="skill2">Design</label>
        <input type="checkbox" id="skill3" name="skills" value="management">
        <label for="skill3">Management</label><br>
        <label for="lang">Select your language:</label>
        <select id="lang" name="lang" required>
            <option value="english">English</option>
            <option value="spanish">Tamil</option>
            <option value="french">Malayalam</option>
        </select><br>
        <label for="sports">Select your Sports:</label>
        <input type="checkbox" id="sports1" name="sports" value="cricket">
        <label for="sports1">Cricket</label>
        <input type="checkbox" id="sports2" name="sports" value="football">
        <label for="sports2">Football</label>
        <input type="checkbox" id="sports3" name="sports" value="basketball">
        <label for="sports3">Basketball</label><br>
        <label for="resume">Upload your Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required><br>
        <input type="image" src="icons8-reset-24.png" alt="resert" width="70" height="70">
        <input type="image" src="icons8-submit-48.png" alt="submit" width="70" height="70">

    </form>
</body>

</html>
