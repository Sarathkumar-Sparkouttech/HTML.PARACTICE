<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icons8-html-16.png">
    <title>Colors</title>
    <style>
        .head1 {
            color: green;
            background-color: black;
        }
        .head2 {
            color: rgb(0, 0, 0);
            background-color: rgb(249, 4, 33);
        }
        .head3 {
            color: rgba(255, 0, 234, 0.5);
            background-color: rgba(38, 237, 24, 0.5);
        }
        .head4 {
            color: #00f;
            background-color: #00ff00;
        }
        .head5 {
            color: hsl(0, 100%, 20%);
            background-color: hsl(22, 22%, 70%);
        }
        .head6 {
            color: hsla(356, 92%, 50%, 0.5);
            background-color: hsla(142, 94%, 48%, 0.1);
        }
    </style>
</head>
<body>
    <h1 class="head1">Color</h1>
    <h1 class="head2">R_G_B</h1>
    <!--Red Blue Green Values 0 to 255  Eg:rgb(255, 0, 234)-->
    <h1 class="head3">R_G_B_A</h1>
    <!--Red Blue Green Alpha (Alpha na color Lightness)  Values 0.0 to 1.1 Eg:rgba(255, 0, 234, 0.5)-->
    <h1 class="head4">Hexadecimal</h1>
    <!--HEX na start( # 00 f), ( Numbers0 to 9),(Characters A to F) Eg:#00ff00 -->
    <h1 class="head5">HSL hue saturation, and lightness.</h1>
    <!-- HSl = H(0 t0 360 ) S(0 to 100 ),L(0 to 100 )  Eg:hs(l22, 22%,70%) -->
    <h1 class="head6">HSLA hue saturation, and lightness Alphabet</h1>
    <!-- HSlA = H(0 t0 360 ) S(0 to 100 ),L(0 to 100 )A(0.0 to 1)  Eg :hsla(142, 94%, 48%, 0.1)-->
</body>
</html>
